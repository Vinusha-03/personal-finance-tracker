
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction - Personal Finance Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                Personal Finance Tracker
            </a>

        </div>
    </nav>


    <!-- Edit Transaction Form -->
    <div class="container mt-5">

        <div class="card">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Edit Transaction</h5>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <!-- Transaction Type -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Transaction Type</label>

                            <select class="form-select" name="type" required>

                                <option value="income"
                                    {% if transaction.type == "income" %}selected{% endif %}>
                                    Income
                                </option>

                                <option value="expense"
                                    {% if transaction.type == "expense" %}selected{% endif %}>
                                    Expense
                                </option>

                            </select>
                        </div>


                        <!-- Category -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>

                            <input type="text"
                                class="form-control"
                                name="category"
                                value="{{ transaction.category }}"
                                required>
                        </div>


                        <!-- Amount -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Amount (₹)</label>

                            <input type="number"
                                class="form-control"
                                name="amount"
                                value="{{ transaction.amount }}"
                                min="0.01"
                                step="0.01"
                                required>
                        </div>


                        <!-- Payment Method -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Payment Method</label>

                            <select class="form-select" name="payment_method" required>

                                <option value="Cash"
                                    {% if transaction.payment_method == "Cash" %}selected{% endif %}>
                                    Cash
                                </option>

                                <option value="UPI"
                                    {% if transaction.payment_method == "UPI" %}selected{% endif %}>
                                    UPI
                                </option>

                                <option value="Credit Card"
                                    {% if transaction.payment_method == "Credit Card" %}selected{% endif %}>
                                    Credit Card
                                </option>

                                <option value="Debit Card"
                                    {% if transaction.payment_method == "Debit Card" %}selected{% endif %}>
                                    Debit Card
                                </option>

                                <option value="Bank Transfer"
                                    {% if transaction.payment_method == "Bank Transfer" %}selected{% endif %}>
                                    Bank Transfer
                                </option>

                            </select>
                        </div>


                        <!-- Date -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date</label>

                            <input type="date"
                                class="form-control"
                                name="date"
                                value="{{ transaction.date.strftime('%Y-%m-%d') }}"
                                required>
                        </div>


                        <!-- Description -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Description</label>

                            <input type="text"
                                class="form-control"
                                name="description"
                                value="{{ transaction.description }}">
                        </div>

                    </div>


                    <!-- Buttons -->
                    <button type="submit" class="btn btn-success">
                        Update Transaction
                    </button>

                    <a href="/" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
